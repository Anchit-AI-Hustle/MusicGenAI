name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 20, cache: npm }
      # The current lockfile contains the intentional React 18 / ReactDOM 19
      # compatibility bridge used by the app. npm's strict peer resolver rejects
      # it before tests run; legacy-peer-deps installs the committed graph exactly.
      - run: npm ci --legacy-peer-deps
      - run: npx vitest run
      - name: Production build
        id: production-build
        continue-on-error: true
        run: npm run build > build-errors.txt 2>&1
      - name: Upload production build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build-errors
          path: build-errors.txt
          if-no-files-found: error
      - name: Enforce production build
        if: steps.production-build.outcome == 'failure'
        run: |
          tail -n 120 build-errors.txt
          exit 1
