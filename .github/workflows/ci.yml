name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      # Install the committed graph while preserving the repository's known
      # React peer-version bridge.
      - run: npm ci --legacy-peer-deps
      - run: npx vitest run
      - run: npm run build
