name: Refresh SpessaSynth lockfile

on:
  push:
    branches:
      - agent/shared-project-playbooks

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/shared-project-playbooks
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Regenerate dependency lock
        run: npm install --package-lock-only --legacy-peer-deps --ignore-scripts
      - name: Remove one-time workflow and commit lock
        shell: bash
        run: |
          rm .github/workflows/refresh-spessasynth-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-spessasynth-lock.yml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "Refresh SpessaSynth dependency lock"
          git push origin HEAD:agent/shared-project-playbooks
